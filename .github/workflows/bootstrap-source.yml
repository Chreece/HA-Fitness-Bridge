name: Bootstrap frozen source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand frozen Phase 30 bridge source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .bootstrap ]; then
            echo 'Bootstrap source already expanded.'
            exit 0
          fi
          cat .bootstrap/source.part-* > /tmp/source.zip
          echo 'c52ef9c8761b02eba54c679db8678510fe2589db811cc03f6bebdc249aada6f7  /tmp/source.zip' | sha256sum -c -
          unzip -oq /tmp/source.zip -d .
          rm -rf .bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Import frozen Phase 30 bridge source'
            git push
          fi
